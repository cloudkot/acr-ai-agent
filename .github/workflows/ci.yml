name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Включаем кэширование зависимостей для скорости

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      working-directory: ./backend
      # [ТРЕБОВАНИЕ КЕЙСА]: Передаем фейковые ключи, чтобы OpenAI клиент не падал при инициализации
      env:
        OPENAI_API_KEY: "sk-dummy-key-for-ci"
        OPENAI_BASE_URL: "https://hub.gigaschool.ru/api/v1/llm/v1"
      run: |
        pytest tests/ -v --tb=short